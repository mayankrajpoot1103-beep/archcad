<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ArchCAD M3">
  <title>ArchCAD M3 - Architectural Massing & CAD Studio</title>

  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">

  <!-- Core CAD & 3D Massing Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.min.js"></script>

  <style>
    :root {
      --bg-dark: #121417;
      --panel-bg: #1c2026;
      --panel-border: #2e3642;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --active-btn: #3b82f6;
      --snap-color: #10b981;
    }

    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    header {
      height: 48px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      gap: 8px;
      z-index: 20;
    }

    .brand {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand span { color: var(--active-btn); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #viewport-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .viewport {
      position: relative;
      height: 100%;
      overflow: hidden;
    }

    #cad-view {
      flex: 1.1;
      background: #0d1117;
      border-right: 2px solid var(--panel-border);
    }

    #three-view {
      flex: 0.9;
      background: #181d24;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .floating-toolbar {
      position: absolute;
      background: rgba(28, 32, 38, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      display: flex;
      padding: 5px;
      gap: 4px;
      z-index: 10;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    #draw-tools {
      left: 14px;
      top: 14px;
      flex-direction: column;
    }

    #massing-inspector {
      position: absolute;
      bottom: 14px;
      right: 14px;
      width: 290px;
      background: rgba(28, 32, 38, 0.94);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 14px;
      z-index: 10;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }

    .inspector-title {
      font-size: 13px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-dim);
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .form-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .form-group label { color: var(--text); }
    .form-group input {
      width: 80px;
      background: #121417;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: #fff;
      padding: 5px 8px;
      text-align: right;
      font-size: 13px;
    }

    button, label.btn {
      min-width: 42px;
      height: 42px;
      background: #252b36;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      padding: 0 10px;
      transition: background 0.15s, border-color 0.15s;
    }

    button:active, label.btn:active {
      transform: scale(0.96);
    }

    button.active {
      background: var(--active-btn);
      border-color: #60a5fa;
      color: white;
    }

    .btn-sm {
      height: 32px;
      font-size: 12px;
      padding: 0 8px;
    }

    #status-bar {
      height: 28px;
      background: var(--panel-bg);
      border-top: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 11px;
      color: var(--text-dim);
      font-family: monospace;
      z-index: 20;
    }

    #loading-indicator {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      border: 1px solid var(--panel-border);
      padding: 16px 28px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      z-index: 100;
    }
  </style>
</head>
<body>

<div id="app-container">
  <header>
    <div class="brand">
      <span>📐</span> ArchCAD <span>M3</span>
    </div>

    <div class="header-actions">
      <button class="btn-sm" id="btn-undo">↶ Undo</button>
      <button class="btn-sm" id="btn-redo">↷ Redo</button>
      <label class="btn btn-sm" for="file-input">Import DXF</label>
      <input type="file" id="file-input" accept=".dxf" style="display:none;">
      <button class="btn-sm" id="btn-export-dxf">Export DXF</button>
      <button class="btn-sm" id="btn-export-obj">Export 3D</button>
      <button class="btn-sm" id="btn-save-local">Save</button>
    </div>
  </header>

  <div id="viewport-container">
    <div class="viewport" id="cad-view">
      <canvas id="cad-canvas"></canvas>

      <div class="floating-toolbar" id="draw-tools">
        <button id="tool-select" class="active" title="Select">Select</button>
        <button id="tool-footprint" title="Closed Building Footprint">Footprint</button>
        <button id="tool-line" title="Line">Line</button>
        <button id="tool-rect" title="Rectangle">Rect</button>
        <button id="tool-delete" title="Delete Selection">Del</button>
      </div>
    </div>

    <div class="viewport" id="three-view">
      <div id="three-canvas-container" style="width:100%; height:100%;"></div>

      <div id="massing-inspector">
        <div class="inspector-title">Parametric Mass Settings</div>
        <div class="form-group">
          <label for="num-storeys">Storeys:</label>
          <input type="number" id="num-storeys" value="6" min="1" max="120">
        </div>
        <div class="form-group">
          <label for="floor-height">Floor Ht (m):</label>
          <input type="number" id="floor-height" value="3.5" step="0.1" min="2.0">
        </div>
        <div class="form-group">
          <label>Total Height:</label>
          <span id="label-total-height" style="font-weight:600; color:#60a5fa;">21.0 m</span>
        </div>
        <button id="btn-generate-mass" style="width:100%; margin-top:8px; background:var(--accent);">Update 3D Mass</button>
      </div>
    </div>

    <div id="loading-indicator">Processing DXF Drawing...</div>
  </div>

  <div id="status-bar">
    <div id="status-coords">X: 0.000 m | Y: 0.000 m</div>
    <div id="status-snap">SNAP: GRID (1.0m) / ENDPOINT</div>
    <div id="status-info">Apple Pencil & Touch Ready (M3 Optimized)</div>
  </div>
</div>

<script>
// --- Service Worker Registration for PWA ---
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker active:', reg.scope))
      .catch(err => console.error('Service Worker registration failed:', err));
  });
}

// --- CAD STATE & DATA ENGINE ---
const CAD = {
  entities: [],
  selectedIds: new Set(),
  activeTool: 'select',
  pan: { x: 40, y: 350 },
  zoom: 25.0,
  gridSize: 1.0,
  snapDist: 15,
  history: [],
  historyIndex: -1,
  currentPoints: [],
  snapPoint: null,
  activePointers: new Map()
};

const canvas = document.getElementById('cad-canvas');
const ctx = canvas.getContext('2d');
const cadView = document.getElementById('cad-view');

function resizeCanvas() {
  const rect = cadView.getBoundingClientRect();
  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;
  renderCAD();
}
window.addEventListener('resize', () => {
  resizeCanvas();
  resizeThree();
});

function screenToWorld(sx, sy) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (sx - rect.left - CAD.pan.x) / CAD.zoom,
    y: (CAD.pan.y - (sy - rect.top)) / CAD.zoom
  };
}

function worldToScreen(wx, wy) {
  return {
    x: CAD.pan.x + wx * CAD.zoom,
    y: CAD.pan.y - wy * CAD.zoom
  };
}

function getSnapPoint(worldPos) {
  let bestDist = CAD.snapDist / CAD.zoom;
  let snapped = null;
  let snapType = 'GRID';

  const gx = Math.round(worldPos.x / CAD.gridSize) * CAD.gridSize;
  const gy = Math.round(worldPos.y / CAD.gridSize) * CAD.gridSize;
  const gridDist = Math.hypot(worldPos.x - gx, worldPos.y - gy);
  if (gridDist < bestDist) {
    snapped = { x: gx, y: gy };
    bestDist = gridDist;
  }

  for (const ent of CAD.entities) {
    for (let i = 0; i < ent.points.length; i++) {
      const p1 = ent.points[i];
      const d1 = Math.hypot(worldPos.x - p1.x, worldPos.y - p1.y);
      if (d1 < bestDist) {
        bestDist = d1;
        snapped = { x: p1.x, y: p1.y };
        snapType = 'ENDPOINT';
      }

      if (i < ent.points.length - 1 || ent.closed) {
        const p2 = ent.points[(i + 1) % ent.points.length];
        const midX = (p1.x + p2.x) / 2;
        const midY = (p1.y + p2.y) / 2;
        const dMid = Math.hypot(worldPos.x - midX, worldPos.y - midY);
        if (dMid < bestDist) {
          bestDist = dMid;
          snapped = { x: midX, y: midY };
          snapType = 'MIDPOINT';
        }
      }
    }
  }

  document.getElementById('status-snap').innerText = `SNAP: ${snapType}`;
  return snapped || worldPos;
}

function renderCAD() {
  const dpr = window.devicePixelRatio || 1;
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);

  const width = canvas.width / dpr;
  const height = canvas.height / dpr;

  drawGrid(width, height);

  CAD.entities.forEach(ent => {
    const isSelected = CAD.selectedIds.has(ent.id);
    ctx.lineWidth = isSelected ? 3 : 1.5;
    ctx.strokeStyle = isSelected ? '#3b82f6' : (ent.color || '#e2e8f0');

    if (ent.points.length < 2) return;
    ctx.beginPath();
    const s0 = worldToScreen(ent.points[0].x, ent.points[0].y);
    ctx.moveTo(s0.x, s0.y);

    for (let i = 1; i < ent.points.length; i++) {
      const s = worldToScreen(ent.points[i].x, ent.points[i].y);
      ctx.lineTo(s.x, s.y);
    }

    if (ent.closed) {
      ctx.closePath();
      if (ent.isBuildingMass) {
        ctx.fillStyle = isSelected ? 'rgba(59, 130, 246, 0.25)' : 'rgba(37, 99, 235, 0.15)';
        ctx.fill();
      }
    }
    ctx.stroke();

    if (isSelected) {
      ctx.fillStyle = '#60a5fa';
      ent.points.forEach(pt => {
        const sp = worldToScreen(pt.x, pt.y);
        ctx.fillRect(sp.x - 3, sp.y - 3, 6, 6);
      });
    }
  });

  if (CAD.currentPoints.length > 0) {
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    const sp0 = worldToScreen(CAD.currentPoints[0].x, CAD.currentPoints[0].y);
    ctx.moveTo(sp0.x, sp0.y);
    for (let i = 1; i < CAD.currentPoints.length; i++) {
      const sp = worldToScreen(CAD.currentPoints[i].x, CAD.currentPoints[i].y);
      ctx.lineTo(sp.x, sp.y);
    }
    if (CAD.snapPoint) {
      const sSnap = worldToScreen(CAD.snapPoint.x, CAD.snapPoint.y);
      ctx.lineTo(sSnap.x, sSnap.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  if (CAD.snapPoint) {
    const sp = worldToScreen(CAD.snapPoint.x, CAD.snapPoint.y);
    ctx.strokeStyle = '#10b981';
    ctx.lineWidth = 2;
    ctx.strokeRect(sp.x - 6, sp.y - 6, 12, 12);
  }

  ctx.restore();
}

function drawGrid(w, h) {
  const step = CAD.gridSize * CAD.zoom;
  if (step < 8) return;

  ctx.lineWidth = 0.5;
  ctx.strokeStyle = '#1f2937';

  const startX = CAD.pan.x % step;
  const startY = CAD.pan.y % step;

  ctx.beginPath();
  for (let x = startX; x < w; x += step) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, h);
  }
  for (let y = startY; y < h; y += step) {
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
  }
  ctx.stroke();

  const origin = worldToScreen(0, 0);
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(origin.x, origin.y);
  ctx.lineTo(origin.x + 40, origin.y);
  ctx.stroke();

  ctx.strokeStyle = '#22c55e';
  ctx.beginPath();
  ctx.moveTo(origin.x, origin.y);
  ctx.lineTo(origin.x, origin.y - 40);
  ctx.stroke();
}

let touchStartDist = 0;
let lastTouchCenter = null;

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  CAD.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });

  if (CAD.activePointers.size === 2) {
    const pts = Array.from(CAD.activePointers.values());
    touchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    lastTouchCenter = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
    return;
  }

  if (CAD.activePointers.size === 1) {
    const rawPos = screenToWorld(e.clientX, e.clientY);
    const snap = getSnapPoint(rawPos);
    CAD.snapPoint = snap;

    if (CAD.activeTool === 'select') {
      handleSelect(rawPos);
    } else if (CAD.activeTool === 'footprint' || CAD.activeTool === 'line') {
      CAD.currentPoints.push(snap);
    } else if (CAD.activeTool === 'rect') {
      if (CAD.currentPoints.length === 0) {
        CAD.currentPoints.push(snap);
      } else {
        const p1 = CAD.currentPoints[0];
        const p2 = snap;
        createEntity({
          type: 'footprint',
          closed: true,
          isBuildingMass: true,
          storeys: parseInt(document.getElementById('num-storeys').value),
          floorHeight: parseFloat(document.getElementById('floor-height').value),
          points: [
            { x: p1.x, y: p1.y },
            { x: p2.x, y: p1.y },
            { x: p2.x, y: p2.y },
            { x: p1.x, y: p2.y }
          ]
        });
        CAD.currentPoints = [];
        syncMassingTo3D();
      }
    }
    renderCAD();
  }
});

canvas.addEventListener('pointermove', (e) => {
  e.preventDefault();
  if (!CAD.activePointers.has(e.pointerId)) return;
  CAD.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });

  if (CAD.activePointers.size === 2) {
    const pts = Array.from(CAD.activePointers.values());
    const currentDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    const center = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };

    if (touchStartDist > 0 && lastTouchCenter) {
      const zoomFactor = currentDist / touchStartDist;
      CAD.zoom = Math.min(Math.max(CAD.zoom * zoomFactor, 2), 250);
      CAD.pan.x += (center.x - lastTouchCenter.x);
      CAD.pan.y += (center.y - lastTouchCenter.y);
      touchStartDist = currentDist;
      lastTouchCenter = center;
    }
    renderCAD();
    return;
  }

  const rawPos = screenToWorld(e.clientX, e.clientY);
  CAD.snapPoint = getSnapPoint(rawPos);
  document.getElementById('status-coords').innerText = `X: ${CAD.snapPoint.x.toFixed(3)} m | Y: ${CAD.snapPoint.y.toFixed(3)} m`;
  renderCAD();
});

canvas.addEventListener('pointerup', (e) => {
  e.preventDefault();
  canvas.releasePointerCapture(e.pointerId);
  CAD.activePointers.delete(e.pointerId);

  if (CAD.activeTool === 'footprint' && CAD.currentPoints.length >= 3) {
    const firstPt = CAD.currentPoints[0];
    const lastPt = CAD.currentPoints[CAD.currentPoints.length - 1];
    if (Math.hypot(firstPt.x - lastPt.x, firstPt.y - lastPt.y) < (CAD.snapDist * 2 / CAD.zoom)) {
      CAD.currentPoints.pop();
      createEntity({
        type: 'footprint',
        closed: true,
        isBuildingMass: true,
        storeys: parseInt(document.getElementById('num-storeys').value),
        floorHeight: parseFloat(document.getElementById('floor-height').value),
        points: [...CAD.currentPoints]
      });
      CAD.currentPoints = [];
      syncMassingTo3D();
      renderCAD();
    }
  }
});

function handleSelect(worldPos) {
  CAD.selectedIds.clear();
  for (let i = CAD.entities.length - 1; i >= 0; i--) {
    const ent = CAD.entities[i];
    if (ent.closed && ent.points.length >= 3) {
      let inside = false;
      for (let j = 0, k = ent.points.length - 1; j < ent.points.length; k = j++) {
        const xi = ent.points[j].x, yi = ent.points[j].y;
        const xk = ent.points[k].x, yk = ent.points[k].y;
        const intersect = ((yi > worldPos.y) !== (yk > worldPos.y)) &&
          (worldPos.x < (xk - xi) * (worldPos.y - yi) / (yk - yi) + xi);
        if (intersect) inside = !inside;
      }
      if (inside) {
        CAD.selectedIds.add(ent.id);
        if (ent.isBuildingMass) {
          document.getElementById('num-storeys').value = ent.storeys;
          document.getElementById('floor-height').value = ent.floorHeight;
          updateHeightLabel();
        }
        break;
      }
    }
  }
}

function pushHistory() {
  CAD.history = CAD.history.slice(0, CAD.historyIndex + 1);
  CAD.history.push(JSON.stringify(CAD.entities));
  CAD.historyIndex++;
}

function createEntity(data) {
  pushHistory();
  const entity = {
    id: 'ent_' + Math.random().toString(36).substr(2, 9),
    ...data
  };
  CAD.entities.push(entity);
  return entity;
}

document.getElementById('btn-undo').onclick = () => {
  if (CAD.historyIndex > 0) {
    CAD.historyIndex--;
    CAD.entities = JSON.parse(CAD.history[CAD.historyIndex]);
    CAD.selectedIds.clear();
    renderCAD();
    syncMassingTo3D();
  }
};

document.getElementById('btn-redo').onclick = () => {
  if (CAD.historyIndex < CAD.history.length - 1) {
    CAD.historyIndex++;
    CAD.entities = JSON.parse(CAD.history[CAD.historyIndex]);
    renderCAD();
    syncMassingTo3D();
  }
};

document.getElementById('tool-delete').onclick = () => {
  if (CAD.selectedIds.size > 0) {
    pushHistory();
    CAD.entities = CAD.entities.filter(e => !CAD.selectedIds.has(e.id));
    CAD.selectedIds.clear();
    renderCAD();
    syncMassingTo3D();
  }
};

const toolButtons = ['tool-select', 'tool-footprint', 'tool-line', 'tool-rect'];
toolButtons.forEach(id => {
  const btn = document.getElementById(id);
  btn.onclick = () => {
    toolButtons.forEach(b => document.getElementById(b).classList.remove('active'));
    btn.classList.add('active');
    CAD.activeTool = id.replace('tool-', '');
    CAD.currentPoints = [];
    renderCAD();
  };
});

// --- THREE.JS 3D MASSING VIEWPORT ---
let scene, camera, renderer, controls, massGroup;

function initThree() {
  const container = document.getElementById('three-canvas-container');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x181d24);

  camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 1000);
  camera.position.set(60, 80, 100);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;

  const hemiLight = new THREE.HemisphereLight(0xffffff, 0x334155, 0.8);
  scene.add(hemiLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
  dirLight.position.set(40, 90, 40);
  dirLight.castShadow = true;
  scene.add(dirLight);

  const gridHelper = new THREE.GridHelper(200, 100, 0x3b82f6, 0x2e3642);
  scene.add(gridHelper);

  massGroup = new THREE.Group();
  scene.add(massGroup);

  animateThree();
}

function resizeThree() {
  const container = document.getElementById('three-canvas-container');
  if (!renderer || !camera) return;
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
}

function animateThree() {
  requestAnimationFrame(animateThree);
  controls.update();
  renderer.render(scene, camera);
}

function syncMassingTo3D() {
  while (massGroup.children.length > 0) {
    const obj = massGroup.children[0];
    massGroup.remove(obj);
    if (obj.geometry) obj.geometry.dispose();
  }

  CAD.entities.filter(e => e.isBuildingMass && e.closed).forEach(massEnt => {
    if (massEnt.points.length < 3) return;

    const shape = new THREE.Shape();
    shape.moveTo(massEnt.points[0].x, -massEnt.points[0].y);
    for (let i = 1; i < massEnt.points.length; i++) {
      shape.lineTo(massEnt.points[i].x, -massEnt.points[i].y);
    }
    shape.closePath();

    const totalHeight = massEnt.storeys * massEnt.floorHeight;
    const extrudeSettings = { steps: 1, depth: totalHeight, bevelEnabled: false };
    const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
    geom.rotateX(Math.PI / 2);

    const massMaterial = new THREE.MeshStandardMaterial({
      color: 0x3b82f6,
      roughness: 0.25,
      metalness: 0.1,
      transparent: true,
      opacity: 0.8
    });

    const mesh = new THREE.Mesh(geom, massMaterial);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    massGroup.add(mesh);

    for (let f = 1; f <= massEnt.storeys; f++) {
      const slabY = f * massEnt.floorHeight;
      const slabGeom = new THREE.BufferGeometry();
      const slabPts = [];
      massEnt.points.forEach(p => slabPts.push(new THREE.Vector3(p.x, slabY, -p.y)));
      slabPts.push(new THREE.Vector3(massEnt.points[0].x, slabY, -massEnt.points[0].y));
      slabGeom.setFromPoints(slabPts);

      const slabLine = new THREE.Line(slabGeom, new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 }));
      massGroup.add(slabLine);
    }
  });
}

function updateHeightLabel() {
  const s = parseInt(document.getElementById('num-storeys').value) || 1;
  const h = parseFloat(document.getElementById('floor-height').value) || 3.5;
  document.getElementById('label-total-height').innerText = (s * h).toFixed(1) + ' m';
}

document.getElementById('num-storeys').oninput = updateHeightLabel;
document.getElementById('floor-height').oninput = updateHeightLabel;

document.getElementById('btn-generate-mass').onclick = () => {
  const s = parseInt(document.getElementById('num-storeys').value);
  const h = parseFloat(document.getElementById('floor-height').value);
  CAD.selectedIds.forEach(id => {
    const ent = CAD.entities.find(e => e.id === id);
    if (ent && ent.isBuildingMass) {
      ent.storeys = s;
      ent.floorHeight = h;
    }
  });
  syncMassingTo3D();
  renderCAD();
};

// --- DXF IMPORT / EXPORT & LOCAL STORAGE ---
document.getElementById('file-input').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const indicator = document.getElementById('loading-indicator');
  indicator.style.display = 'block';

  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const parser = new DxfParser();
      const dxf = parser.parseSync(evt.target.result);
      pushHistory();
      CAD.entities = [];

      dxf.entities.forEach(dxfEnt => {
        if (dxfEnt.type === 'LINE') {
          CAD.entities.push({
            id: 'ent_' + Math.random().toString(36).substr(2, 9),
            type: 'line',
            closed: false,
            points: [
              { x: dxfEnt.vertices[0].x, y: dxfEnt.vertices[0].y },
              { x: dxfEnt.vertices[1].x, y: dxfEnt.vertices[1].y }
            ]
          });
        } else if (dxfEnt.type === 'LWPOLYLINE' || dxfEnt.type === 'POLYLINE') {
          const pts = dxfEnt.vertices.map(v => ({ x: v.x, y: v.y }));
          const isClosed = dxfEnt.shape || dxfEnt.closed;
          CAD.entities.push({
            id: 'ent_' + Math.random().toString(36).substr(2, 9),
            type: 'footprint',
            closed: isClosed,
            isBuildingMass: isClosed,
            storeys: 5,
            floorHeight: 3.5,
            points: pts
          });
        }
      });

      renderCAD();
      syncMassingTo3D();
      indicator.style.display = 'none';
      document.getElementById('status-info').innerText = `Loaded ${CAD.entities.length} entities from DXF`;
    } catch (err) {
      alert('Error parsing DXF: ' + err.message);
      indicator.style.display = 'none';
    }
  };
  reader.readAsText(file);
});

document.getElementById('btn-export-dxf').onclick = () => {
  let dxfContent = "0\nSECTION\n2\nHEADER\n0\nENDSEC\n0\nSECTION\n2\nTABLES\n0\nENDSEC\n0\nSECTION\n2\nENTITIES\n";

  CAD.entities.forEach(ent => {
    if (ent.type === 'line' && ent.points.length >= 2) {
      dxfContent += `0\nLINE\n8\nCAD_LAYER\n10\n${ent.points[0].x}\n20\n${ent.points[0].y}\n30\n0.0\n11\n${ent.points[1].x}\n21\n${ent.points[1].y}\n31\n0.0\n`;
    } else if (ent.points.length >= 2) {
      dxfContent += `0\nLWPOLYLINE\n8\nMASSING_LAYER\n90\n${ent.points.length}\n70\n${ent.closed ? 1 : 0}\n`;
      ent.points.forEach(pt => {
        dxfContent += `10\n${pt.x}\n20\n${pt.y}\n`;
      });
    }
  });

  dxfContent += "0\nENDSEC\n0\nEOF\n";

  const blob = new Blob([dxfContent], { type: 'application/dxf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `massing_model_${Date.now()}.dxf`;
  a.click();
};

document.getElementById('btn-export-obj').onclick = () => {
  let objOutput = "# ArchCAD Studio 3D Export\n";
  let vOffset = 1;

  massGroup.traverse(child => {
    if (child.isMesh && child.geometry) {
      const g = child.geometry.clone();
      const pos = g.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        objOutput += `v ${pos.getX(i).toFixed(4)} ${pos.getY(i).toFixed(4)} ${pos.getZ(i).toFixed(4)}\n`;
      }
      if (g.index) {
        for (let i = 0; i < g.index.count; i += 3) {
          objOutput += `f ${g.index.getX(i) + vOffset} ${g.index.getX(i+1) + vOffset} ${g.index.getX(i+2) + vOffset}\n`;
        }
        vOffset += pos.count;
      }
    }
  });

  const blob = new Blob([objOutput], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `building_massing_${Date.now()}.obj`;
  a.click();
};

document.getElementById('btn-save-local').onclick = () => {
  localStorage.setItem('archcad_m3_project', JSON.stringify(CAD.entities));
  alert('Project saved to iPad local storage.');
};

window.onload = () => {
  resizeCanvas();
  initThree();

  const saved = localStorage.getItem('archcad_m3_project');
  if (saved) {
    CAD.entities = JSON.parse(saved);
  } else {
    CAD.entities.push({
      id: 'initial_mass',
      type: 'footprint',
      closed: true,
      isBuildingMass: true,
      storeys: 6,
      floorHeight: 3.5,
      points: [
        { x: 0, y: 0 },
        { x: 30, y: 0 },
        { x: 30, y: 15 },
        { x: 12, y: 15 },
        { x: 12, y: 22 },
        { x: 0, y: 22 }
      ]
    });
  }

  pushHistory();
  renderCAD();
  syncMassingTo3D();
  updateHeightLabel();
};
